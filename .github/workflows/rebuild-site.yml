# Rebuilds the website whenever its source changes, so a product can be added
# by editing data/products.json right on github.com.
#
# 1. Builds docs/ from data/ and src/ and runs the site checks.
# 2. If docs/ changed, commits it back to the same branch.
# 3. Asks GitHub Pages to publish. (Commits made by a workflow don't start a
#    Pages build on their own, so this step requests one.) The site updates
#    within a few minutes.
#
# If the build or the checks fail, nothing is committed and the live site stays
# as it was. The error message in the Actions tab says what to fix.
name: Rebuild site

on:
  push:
    paths:
      - "data/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/rebuild-site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rebuild-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: node scripts/build.mjs

      - name: Check the site
        run: node scripts/check.mjs

      - name: Commit the rebuilt site if it changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "docs/ is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "Rebuild site from data and page files"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to publish the new version
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.source.branch' 2>/dev/null || true)
          if [ -z "$source" ]; then
            echo "GitHub Pages isn't switched on for this repository yet, so there is nothing to publish."
            exit 0
          fi
          if [ "$source" != "${GITHUB_REF_NAME}" ]; then
            echo "Pages publishes from '$source', not '${GITHUB_REF_NAME}'. The live site changes once this branch is merged there."
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
          echo "Requested a GitHub Pages build of '$source'."
